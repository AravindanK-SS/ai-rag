<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Policy Assistant (Week 5 Updated)</title>
    <!-- Use Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --container-bg: #1e212b;
            --primary: #4ade80;
            --primary-hover: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: #3b82f6;
            --bot-msg: #334155;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 600px;
            max-width: 95%;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 1.5rem;
            color: var(--primary);
        }
        
        p.subtitle {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .messages {
            height: 450px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            padding-right: 10px;
        }
        
        /* Custom Scrollbar */
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .message {
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            background: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            background: var(--bot-msg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .sources {
            font-size: 0.75rem;
            color: var(--primary);
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
        }

        .input-area {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: #0f1115;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 0 24px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #000;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--primary-hover);
        }
        
        button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>HR Policy Assistant</h2>
        <p class="subtitle">v2.0 - Optimized Retrieval (k=5) & Concise Responses</p>
        
        <div class="messages" id="chat">
            <div class="message bot-msg">Hello! I am the HR Policy Assistant. Ask me anything about our company policies.</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask about vacation days, working hours..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const question = input.value.trim();
            if(!question) return;

            // Add user message
            chat.innerHTML += `<div class="message user-msg">${question}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // Loading state
            const loadId = 'msg-' + Date.now();
            chat.innerHTML += `<div class="message bot-msg" id="${loadId}">
                <span style="opacity: 0.7;">Searching HR policies...</span>
            </div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/api/query', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question})
                });
                
                if (!res.ok) throw new Error("Server response was not ok");
                
                const data = await res.json();
                
                let sourceHtml = '';
                if(data.sources && data.sources.length > 0) {
                    const uniqueSources = [...new Set(data.sources.map(s => s.file))].filter(Boolean);
                    if(uniqueSources.length > 0) {
                        sourceHtml = `<div class="sources">📚 Sources: ${uniqueSources.join(', ')}</div>`;
                    }
                }
                
                // Update with answer and sources
                document.getElementById(loadId).innerHTML = data.answer.replace(/\n/g, '<br>') + sourceHtml;
                chat.scrollTop = chat.scrollHeight;
                
            } catch(e) {
                document.getElementById(loadId).innerHTML = "<span style='color: #ef4444;'>Error: Could not connect to the server. Make sure app.py is running.</span>";
            }
        }
    </script>
</body>
</html>
